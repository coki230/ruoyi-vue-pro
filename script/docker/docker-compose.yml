version: "3.8"

name: yudao-system

services:
  mysql:
    container_name: yudao-mysql
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "3306:3306"
    command:
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ruoyi-vue-pro
      MYSQL_ROOT_PASSWORD: 123456
    # 巧妙利用 entrypoint：在 MySQL 启动前自动拉取远程 SQL 到 initdb 目录
    entrypoint: >
      sh -c "
      apt-get update && apt-get install -y curl &&
      curl -L https://raw.githubusercontent.com/YunaiV/ruoyi-vue-pro/master/sql/mysql/ruoyi-vue-pro.sql -o /docker-entrypoint-initdb.d/init.sql &&
      exec /entrypoint.sh mysqld
      "
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    container_name: yudao-redis
    image: redis:6-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    container_name: yudao-server
    build:
      context: https://gh-proxy.com/https://github.com/YunaiV/ruoyi-vue-pro.git#master
      dockerfile: yudao-server/Dockerfile
    image: yudao-server:latest
    restart: unless-stopped
    ports:
      - "48080:48080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      JAVA_OPTS: "-Xms512m -Xmx512m -Djava.net.preferIPv4Stack=true"
      ARGS: >-
        --spring.datasource.dynamic.datasource.master.url=jdbc:mysql://yudao-mysql:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
        --spring.datasource.dynamic.datasource.master.username=root
        --spring.datasource.dynamic.datasource.master.password=123456
        --spring.datasource.dynamic.datasource.slave.url=jdbc:mysql://yudao-mysql:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
        --spring.datasource.dynamic.datasource.slave.username=root
        --spring.datasource.dynamic.datasource.slave.password=123456
        --spring.redis.host=yudao-redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin:
    container_name: yudao-admin
    build:
      context: https://gh-proxy.com/https://github.com/yudaocode/yudao-ui-admin-vue3.git#master
      dockerfile_inline: |
        FROM node:18-alpine AS builder
        WORKDIR /app
        RUN corepack enable && corepack prepare pnpm@latest --activate
        ENV NPM_CONFIG_REGISTRY=https://registry.npmmirror.com
        COPY . .
        RUN pnpm install --registry=https://registry.npmmirror.com
        RUN pnpm build:prod
        
        FROM nginx:alpine
        RUN echo 'server { \
            listen 80; \
            location / { root /usr/share/nginx/html; index index.html; try_files $$uri $$uri/ /index.html; } \
            location /admin-api/ { proxy_pass http://yudao-server:48080/admin-api/; } \
        }' > /etc/nginx/conf.d/default.conf
        COPY --from=builder /app/dist /usr/share/nginx/html
        EXPOSE 80
        CMD ["nginx", "-g", "daemon off;"]
    image: yudao-admin-vue3:latest
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - server

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local